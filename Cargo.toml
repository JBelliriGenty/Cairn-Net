[package]
name = "cairn-net"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Web panel for a few MikroTik RouterOS switches (RouterOS API over TLS): ports, devices, VLANs, DHCP servers and reservations, written directly or through Git, lease names in DNS, and per-switch settings with automatic rollback"
repository = "https://github.com/JBelliriGenty/Cairn-Net"
license = "MIT"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
serde_json = "1"
openssl = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
